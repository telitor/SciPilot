[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xfyun-knowledge-base-client"
version = "1.0.0"
description = "Reusable backend client for the iFlytek Spark Knowledge Base API"
requires-python = ">=3.10"
dependencies = ["requests>=2.31.0,<3.0.0"]

[tool.setuptools.packages.find]
include = ["xfyun_knowledge_base*"]
